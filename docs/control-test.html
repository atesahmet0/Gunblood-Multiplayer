<!doctype html><meta charset="utf-8"><title>Two-browser pointer test</title><style>body{font:14px system-ui;margin:8px}button{padding:12px}iframe{width:100%;height:950px;border:0}pre{max-height:150px;overflow:auto}</style><h1>Two-browser pointer test</h1><p>Pair normally below. These test controls send pointer events through the production client. They do not change game state.</p><button id="ready">Ready cursor</button><button id="fire">Fire at opponent head</button><button id="sky">Fire at sky</button><button id="auto">Ready and fire duel</button><button id="inspect">Inspect visible state</button><pre id="report">Pair below</pre><iframe title="Multiplayer client" src="./"></iframe><script>
const f=document.querySelector('iframe');function w(){return f.contentWindow;}function api(n,...a){return w().document.querySelector('ruffle-player')?.ruffle().callExternalInterface(n,...a);}function pointer(x,y,fire=false){let target=w().document.querySelector('#input'),b=target.getBoundingClientRect();let e={bubbles:true,clientX:b.left+x*b.width/720,clientY:b.top+y*b.height/425,pointerId:1,pointerType:'mouse'};target.dispatchEvent(new (w().PointerEvent)('pointermove',e));if(fire)target.dispatchEvent(new (w().PointerEvent)('pointerdown',e));}
function inspect(){let s=api('mpInspect');document.querySelector('#report').textContent=JSON.stringify({game:s,score:w().document.querySelector('#score').textContent,status:w().document.querySelector('#status').textContent},null,2);}
document.querySelector('#ready').onclick=()=>setTimeout(()=>{let s=api('mpInspect');pointer(350,200);pointer(s.role==='host'?85:635,385);inspect();},300);document.querySelector('#fire').onclick=()=>{let s=api('mpInspect'),p=s.heads[s.role==='host'?1:0];pointer(p.x,p.y,true);inspect();};document.querySelector('#sky').onclick=()=>{let s=api('mpInspect');pointer(s.role==='host'?600:100,0,true);inspect();};document.querySelector('#inspect').onclick=inspect;
document.querySelector('#auto').onclick=async()=>{
 const wait=ms=>new Promise(r=>setTimeout(r,ms));await wait(400);
 for(let n=0;n<100&&api('mpInspect').state!=='playing';n++){let s=api('mpInspect');pointer(350,200);pointer(s.role==='host'?85:635,385);await wait(150);inspect();}
 for(let n=0;n<6&&api('mpInspect').state==='playing';n++){let s=api('mpInspect'),p=s.heads[s.role==='host'?1:0];pointer(p.x,p.y,true);await wait(700);inspect();}
 inspect();
};
</script>
