<!doctype html><meta charset="utf-8"><title>Guest render profiling</title>
<style>body{font:14px system-ui}iframe{width:800px;height:900px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Guest render and network profiling</h1>
<button id="run">Measure moving gameplay</button>
<button id="slow">Measure 256 kbit/s upload</button>
<button id="fallback">Measure full-snapshot fallback at 256 kbit/s</button>
<pre id="report">Ready</pre><iframe src="test-runner.html" title="Integration"></iframe>
<script>
const el=(w,s)=>w.document.querySelector(s),api=(w,n,...args)=>el(w,'ruffle-player')?.ruffle().callExternalInterface(n,...args),info=w=>api(w,'mpInspect'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const report=document.querySelector('#report');
async function measure(mode){
 document.querySelectorAll('button').forEach(b=>b.disabled=true);report.textContent='Running…';
 try{
  const w=document.querySelector('iframe').contentWindow;await w.init(false,false,mode);
  const [host,guest]=w.testClients();let times=[];const player=el(guest,'ruffle-player'),original=player.ruffle.bind(player);
  player.ruffle=()=>{const engine=original();return {callExternalInterface(name,...args){const t=performance.now(),result=engine.callExternalInterface(name,...args);if(name==='mpApply')times.push(performance.now()-t);return result;}};};
  w.ready();await w.until(()=>info(host)?.state==='playing','FIRE');
  times=[];const before=host.testNetworkStats?{...host.testNetworkStats}:null,begin=performance.now();
  for(let i=0;i<100;i++){w.pointer(host,500+Math.sin(i/8)*100,100+Math.cos(i/8)*100);w.pointer(guest,200+Math.sin(i/8)*100,100+Math.cos(i/8)*100);await sleep(100);}
  const seconds=(performance.now()-begin)/1000;times.sort((a,b)=>a-b);const link=host.testNetworkStats;
  report.textContent=JSON.stringify({mode:mode?.dropReferences?'full fallback':mode?'reference frames / slow upload':'normal',seconds,applies:times.length,updatesPerSecond:times.length/seconds,meanApplyMs:times.reduce((a,b)=>a+b,0)/times.length,p95ApplyMs:times[Math.floor(times.length*.95)],connection:el(guest,'#connection-stats').textContent,wire:link?{...link,meanFrameBytes:(link.stateBytes-before.stateBytes)/(link.stateFrames-before.stateFrames),stateKbps:(link.stateBytes-before.stateBytes)*8/seconds/1000}:null},null,2);
 }catch(e){report.textContent='FAIL '+e.message;}
 finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
document.querySelector('#run').onclick=()=>measure(false);
document.querySelector('#slow').onclick=()=>measure({loss:.2});
document.querySelector('#fallback').onclick=()=>measure({loss:.2,dropReferences:true});
</script>
